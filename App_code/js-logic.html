<!-- Lógica principal de la aplicación -->
<script>
    /**
     * Estado global de la sesión del candidato.
     *
     * @property {Object}   user                  - Datos del candidato capturados en el login.
     * @property {string}   user.nombre            - Nombre completo.
     * @property {string}   user.id                - Cédula / ID.
     * @property {string}   user.sede              - Sede de aplicación.
     * @property {string}   user.cargo             - Cargo postulado.
     *
     * @property {Object}   questions              - Banco de preguntas cargado desde el servidor.
     * @property {Array}    questions.valanti      - Preguntas de la prueba Valanti.
     * @property {Array}    questions.disc         - Preguntas de la prueba DISC.
     *
     * @property {Object}   answers                - Respuestas indexadas por número de pregunta.
     *                                               answers.valanti[i] = [v0, v1] | [null, null]
     *                                               answers.disc[i]    = [a, b, c, d] | [null×4]
     * @property {Object}   status                 - true si la prueba fue completada y guardada.
     * @property {Object}   indexes                - Índice de la pregunta actualmente visible.
     * @property {Object}   current                - Prueba actualmente activa ({ type: 'Valanti'|'DISC' }).
     * @property {Object}   seenInstructions       - Control de modales de instrucción ya mostrados.
     */
    let appData = {
        user: {},
        questions: { valanti: [], disc: [] },
        answers:   { valanti: [], disc: [] },
        status:    { valanti: false, disc: false },
        indexes:   { valanti: 0, disc: 0 },
        current:   { type: null },
        seenInstructions: { valanti_p1: false, valanti_p2: false }
    };

    // ─── CRONÓMETRO GLOBAL (1 hora 20 minutos) ──────────────────────────────────
    const TIMER_DURATION_MS = 80 * 60 * 1000;   // 4 800 000 ms
    let   _timerInterval    = null;

    /** Formatea milisegundos a "HH:MM:SS" */
    function _formatTime(ms) {
        if (ms <= 0) return '0:00:00';
        const totalSec = Math.ceil(ms / 1000);
        const hh = Math.floor(totalSec / 3600);
        const mm = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
        const ss = String(totalSec % 60).padStart(2, '0');
        return hh + ':' + mm + ':' + ss;
    }

    /** Actualiza el span y aplica clases de alerta */
    function _updateTimerDisplay(remainingMs) {
        const el = document.getElementById('test-timer');
        if (!el) return;
        el.textContent = 'Tiempo: ' + _formatTime(remainingMs);
        el.classList.remove('warning', 'danger');
        if (remainingMs <= 300_000)      el.classList.add('danger');
        else if (remainingMs <= 600_000) el.classList.add('warning');
    }

    /**
     * Inicia el cronómetro desde sessionStorage (reanuda) o desde 0 (nuevo).
     * Debe llamarse cuando el candidato ingresa al panel de pruebas por primera vez.
     */
    function startGlobalTimer() {
        // Si el tiempo ya expiró antes de que se llame, ir a timeout de inmediato
        const savedEnd = sessionStorage.getItem('timerEndTime');
        if (savedEnd) {
            const remaining = parseInt(savedEnd) - Date.now();
            if (remaining <= 0) {
                onTimeUp(true);  // expired on reload
                return;
            }
        }

        // Calcular el endTime correcto
        let endTime;
        if (savedEnd && !sessionStorage.getItem('timerPaused')) {
            // Sesión en curso, prueba activa → usar endTime guardado
            endTime = parseInt(savedEnd);
        } else if (sessionStorage.getItem('timerPaused') === 'true') {
            // Estaba pausado → reanudar desde el tiempo restante guardado
            resumeTimer();
            return;
        } else {
            // Primera vez → calcular nuevo endTime
            endTime = Date.now() + TIMER_DURATION_MS;
            sessionStorage.setItem('timerEndTime', String(endTime));
        }

        _runTimerLoop(endTime);
    }

    /** Bucle principal del cronómetro */
    function _runTimerLoop(endTime) {
        if (_timerInterval) clearInterval(_timerInterval);

        _timerInterval = setInterval(() => {
            const remaining = endTime - Date.now();
            _updateTimerDisplay(remaining);
            if (remaining <= 0) {
                clearInterval(_timerInterval);
                onTimeUp(false);
            }
        }, 500);

        _updateTimerDisplay(endTime - Date.now());  // render inmediato
    }

    /** Pausa el cronómetro (candidato vuelve al panel de selección) */
    function pauseTimer() {
        if (_timerInterval) {
            clearInterval(_timerInterval);
            _timerInterval = null;
        }
        const savedEnd = sessionStorage.getItem('timerEndTime');
        if (savedEnd) {
            const remaining = Math.max(0, parseInt(savedEnd) - Date.now());
            sessionStorage.setItem('timerPaused', 'true');
            sessionStorage.setItem('timerRemainingMs', String(remaining));
        }
    }

    /** Reanuda el cronómetro al entrar a una prueba */
    function resumeTimer() {
        const remainingMs = parseInt(sessionStorage.getItem('timerRemainingMs') || '0');
        if (remainingMs <= 0) {
            onTimeUp(false);
            return;
        }
        const newEndTime = Date.now() + remainingMs;
        sessionStorage.setItem('timerEndTime', String(newEndTime));
        sessionStorage.removeItem('timerPaused');
        sessionStorage.removeItem('timerRemainingMs');
        _runTimerLoop(newEndTime);
    }

    /**
     * Se ejecuta cuando el tiempo llega a 00:00.
     * Guarda respuestas parciales y muestra la pantalla de tiempo agotado.
     * @param {boolean} wasExpired  true si el tiempo ya había expirado al recargar
     */
    function onTimeUp(wasExpired) {
        if (_timerInterval) { clearInterval(_timerInterval); _timerInterval = null; }

        const loader = document.getElementById('loading-overlay');
        const loaderText = loader ? loader.querySelector('p') : null;

        // Guardar respuestas parciales de la prueba actualmente activa (si hay)
        const activeType = appData.current && appData.current.type;
        const activeKey  = activeType ? activeType.toLowerCase() : null;

        const savePending = activeKey &&
                            !appData.status[activeKey] &&
                            appData.answers[activeKey] &&
                            appData.answers[activeKey].length > 0;

        const goToTimeout = () => {
            showView('view-timeout');
        };

        if (savePending && !wasExpired) {
            if (loaderText) loaderText.innerText = 'Guardando respuestas parciales...';
            if (loader) loader.classList.remove('hidden');

            let flatAnswers = [];
            appData.answers[activeKey].forEach(arr => {
                if (arr) flatAnswers.push(...arr);
            });

            google.script.run
                .withSuccessHandler(() => {
                    if (loader) loader.classList.add('hidden');
                    goToTimeout();
                })
                .withFailureHandler(() => {
                    if (loader) loader.classList.add('hidden');
                    goToTimeout();
                })
                .saveTestResults(activeType, appData.user, flatAnswers);
        } else {
            goToTimeout();
        }
    }
    // ─────────────────────────────────────────────────────────────────────────

    // 1. INICIAR Y CARGAR DATOS

    window.onload = function () {
        google.script.run
            .withSuccessHandler(data => {
                appData.questions = data;
                document.getElementById('loading-overlay').classList.add('hidden');
                showView('view-landing');
            })
            .withFailureHandler(err => {
                alert("Error crítico de conexión. Intente recargar.");
                console.error(err);
            })
            .getStaticQuestions(); // LLAMADA A LA NUEVA FUNCIÓN
    };

    // 2. NAVEGACIÓN
    function showView(id) {
        document.querySelectorAll('.view-section').forEach(el => {
            el.classList.add('hidden');
            el.classList.remove('active');
        });
        const target = document.getElementById(id);
        if (target) {
            target.classList.remove('hidden');
            target.classList.add('active');
        }
        window.scrollTo(0, 0);

        // Mostrar / Ocultar Header (Punto 3 del audio)
        const header = document.getElementById('mainHeader');
        if (header) {
            if (id === 'view-landing') {
                header.classList.add('hidden');
            } else {
                header.classList.remove('hidden');
            }
        }
    }

    function returnToLanding() {
        showView('view-landing');
    }

    // 3. LOGIN
    document.getElementById('loginForm').onsubmit = function (e) {
        e.preventDefault();
        appData.user = {
            nombre: document.getElementById('inp_nombre').value,
            id: document.getElementById('inp_id').value,
            sede: document.getElementById('inp_sede').value,
            cargo: document.getElementById('inp_cargo').value
        };
        document.getElementById('headerName').innerText = appData.user.nombre;
        document.getElementById('headerRole').innerText = appData.user.cargo;
        document.getElementById('userInfoHeader').classList.remove('hidden');
        showView('view-dashboard');
        // Iniciar el cronómetro global la primera vez que accede al panel
        startGlobalTimer();
    };

    // 4. INICIAR PRUEBA
    function startTest(type) {
        const key = type.toLowerCase();
        if (appData.status[key]) return;

        appData.current.type = type;
        if (!appData.answers[key]) appData.answers[key] = [];

        const wrapper = document.getElementById('test-wrapper');
        const color = type === 'Valanti' ? 'var(--primary)' : 'var(--secondary)';
        wrapper.style.borderColor = color;

        document.getElementById('test-type-label').innerText = type;
        document.getElementById('test-type-label').style.color = color;

        renderQuestion();
        showView('view-test');
        // Solo reanudar si estaba pausado; si ya corre, no interrumpir
        if (sessionStorage.getItem('timerPaused') === 'true') {
            resumeTimer();
        }
    }

    function pauseTest() {
        // Pausar el cronómetro al volver al panel de selección
        pauseTimer();
        showView('view-dashboard');
    }

    // 5. RENDERIZAR
    function renderQuestion() {
        const type = appData.current.type;
        const key = type.toLowerCase();
        const list = type === 'Valanti' ? appData.questions.valanti : appData.questions.disc;

        if (appData.indexes[key] < 0) appData.indexes[key] = 0;
        if (appData.indexes[key] >= list.length) appData.indexes[key] = list.length - 1;
        
        const idx = appData.indexes[key]; 
        const q = list[idx];
        const container = document.getElementById('dynamic-container');
        document.getElementById('question-counter').innerText = `${idx + 1} / ${list.length}`;

        // --- VALANTI ---
        if (type === 'Valanti') {
            const part = (q.part) ? q.part : (idx < 9 ? 1 : 2);
            const theme = part === 1 ? 'teal' : 'red';
            const title = part === 1 ? "Parte 1: Identificación Positiva" : "Parte 2: Lo más Inaceptable";

            const instrEl = document.getElementById('test-instruction');
            instrEl.innerHTML = title;
            instrEl.className = `text-xl font-bold text-${theme}-600 transition-colors`;

            if (idx === 0 && !appData.seenInstructions.valanti_p1) {
                showInstructionModal("Instrucciones: Parte 1", `<p class="mb-2">Por favor marque 0, 1, 2 o 3 puntos en las casillas según la importancia que usted le da a cada frase en su vida personal.</p><ul class="list-disc pl-5 mb-2 space-y-1"><li><strong>La suma debe ser siempre 3</strong> (3-0, 0-3, 2-1, 1-2).</li><li>La opción con la que <strong>mejor se identifica</strong> debe tener el mayor puntaje.</li></ul>`, "teal");
                appData.seenInstructions.valanti_p1 = true;
            } else if (idx === 9 && !appData.seenInstructions.valanti_p2) {
                showInstructionModal("Segunda Parte: Cambio de Enfoque", `<p class="mb-2 font-medium text-red-800">¡Atención! Cambian las reglas:</p><p class="mb-2">Por favor marque 0, 1, 2 o 3 puntos para la frase <strong>MÁS INACEPTABLE</strong> o que menos le guste.</p><ul class="list-disc pl-5 mb-2 space-y-1"><li>El puntaje más alto (3) será para la frase que indique <strong>lo peor</strong>.</li><li>La suma debe seguir siendo 3.</li></ul>`, "red");
                appData.seenInstructions.valanti_p2 = true;
            }

            const savedVal = appData.answers.valanti[idx] || [null, null];
            const v0Str = (savedVal[0] !== null && savedVal[0] !== undefined && !isNaN(savedVal[0])) ? savedVal[0] : '';
            const v1Str = (savedVal[1] !== null && savedVal[1] !== undefined && !isNaN(savedVal[1])) ? savedVal[1] : '';

            container.innerHTML = `
                <div class="p-3 bg-${theme}-50 rounded border-l-4 border-${theme}-500 mb-6 text-sm text-${theme}-900 flex items-start animate-fadeIn">
                    <i class="fas ${part === 1 ? 'fa-check' : 'fa-exclamation-triangle'} mt-1 mr-3 text-lg"></i> 
                    <div>
                        <p class="font-bold">${part === 1 ? 'Distribuye 3 puntos a lo que MÁS te identifica.' : 'Distribuye 3 puntos a lo que MENOS aceptas (Lo peor = 3).'}</p>
                        <p class="text-xs opacity-80">La suma siempre debe ser 3.</p>
                    </div>
                </div>
                <div class="space-y-4">
                    <div class="p-6 bg-white border-2 border-slate-100 rounded-xl focus-within:border-${theme}-300 hover:border-${theme}-200 transition-colors shadow-sm">
                        <p class="mb-4 font-medium text-lg text-slate-700">${q.pair[0]}</p>
                        <div class="flex items-center">
                            <span class="mr-3 text-sm font-bold text-slate-400">PUNTOS:</span>
                            <input type="number" id="val_0" min="0" max="3" class="w-full p-3 border-2 rounded-lg text-center text-2xl font-bold text-${theme}-600 focus:border-${theme}-500 outline-none transition" placeholder="0" value="${v0Str}">
                        </div>
                    </div>
                    <div class="p-6 bg-white border-2 border-slate-100 rounded-xl focus-within:border-${theme}-300 hover:border-${theme}-200 transition-colors shadow-sm">
                        <p class="mb-4 font-medium text-lg text-slate-700">${q.pair[1]}</p>
                        <div class="flex items-center">
                            <span class="mr-3 text-sm font-bold text-slate-400">PUNTOS:</span>
                            <input type="number" id="val_1" min="0" max="3" class="w-full p-3 border-2 rounded-lg text-center text-2xl font-bold text-${theme}-600 focus:border-${theme}-500 outline-none transition" placeholder="0" value="${v1Str}">
                        </div>
                    </div>
                </div>`;

            setTimeout(() => {
                const i0 = document.getElementById('val_0');
                const i1 = document.getElementById('val_1');
                if (!i0 || !i1) return;
                const handleInput = (source, target) => {
                    let val = parseInt(source.value);
                    if (isNaN(val)) { target.value = ''; return; }
                    if (val < 0) val = 0;
                    if (val > 3) val = 3;
                    if (val !== parseInt(source.value)) source.value = val;
                    target.value = 3 - val;
                };
                i0.oninput = () => handleInput(i0, i1);
                i1.oninput = () => handleInput(i1, i0);
            }, 100);
        }
        // --- DISC ---
        else {
            document.getElementById('test-instruction').innerText = "Evalúa de 1 (Menos) a 4 (Más)";
            const savedDisc = appData.answers.disc[idx] || [];
            let html = `
                <p class="text-lg font-medium text-slate-800 mb-4 bg-slate-50 p-4 rounded-lg border">${q.text}</p>
                <div class="p-3 bg-red-50 rounded border border-red-100 mb-6 text-sm text-red-800 flex items-center">
                    <i class="fas fa-sort-numeric-up mr-2 text-lg"></i> Ordena las opciones usando 1, 2, 3 y 4. No puedes repetir números.
                </div>
                <div class="space-y-3">`;

            q.options.forEach((opt, i) => {
                const val = (savedDisc[i] !== undefined && savedDisc[i] !== null && !isNaN(savedDisc[i])) ? savedDisc[i] : '';
                html += `
                <div class="flex flex-col sm:flex-row sm:items-center p-4 bg-white rounded-lg border hover:shadow-md transition-shadow">
                    <span class="hidden sm:flex w-8 h-8 items-center justify-center bg-slate-100 rounded-full font-bold text-slate-500 mr-4 border">${['A', 'B', 'C', 'D'][i]}</span>
                    <span class="flex-1 font-medium text-slate-700 mb-2 sm:mb-0">${opt}</span>
                    <div class="flex items-center justify-end sm:ml-4">
                       <span class="text-xs font-bold text-slate-400 mr-2 sm:hidden">VALOR (1-4):</span>
                       <input type="number" data-idx="${i}" value="${val}" class="disc-input w-20 p-2 text-center text-xl font-bold border-2 rounded focus:border-red-500 outline-none" min="1" max="4">
                    </div>
                </div>`;
            });
            container.innerHTML = html + `</div>`;
        }

        updateQuestionMap();
    }

    // 6. NAVEGACIÓN Y VALIDACIÓN LOGICA
    function saveCurrentAnswer() {
        const type = appData.current.type;
        const key = type.toLowerCase();
        const idx = appData.indexes[key];

        if (type === 'Valanti') {
            const i0 = document.getElementById('val_0');
            const i1 = document.getElementById('val_1');
            if (!i0 || !i1) return true;
            
            const v0 = i0.value === '' ? NaN : parseInt(i0.value);
            const v1 = i1.value === '' ? NaN : parseInt(i1.value);

            if (isNaN(v0) && isNaN(v1)) {
                appData.answers.valanti[idx] = [null, null];
                return true; 
            }
            if (isNaN(v0) || isNaN(v1)) {
                alert("Por favor ingresa un número en ambas casillas o déjalas totalmente vacías para omitir.");
                return false;
            }
            if (v0 < 0 || v1 < 0) {
                alert("No se permiten números negativos.");
                return false;
            }
            if ((v0 + v1) !== 3) {
                alert(`La suma actual es ${v0 + v1}. Debe ser exactamente 3.`);
                return false;
            }

            appData.answers.valanti[idx] = [v0, v1];
            return true;
        } else {
            const inputs = Array.from(document.querySelectorAll('.disc-input'));
            if (inputs.length === 0) return true;

            const values = inputs.map(i => i.value === '' ? NaN : parseInt(i.value));
            
            if (values.every(isNaN)) {
                appData.answers.disc[idx] = [null, null, null, null];
                return true;
            }

            if (values.some(isNaN)) {
                alert("Debes calificar todas las opciones o dejar la pregunta en blanco para omitir.");
                return false;
            }
            if (values.some(v => v < 1 || v > 4)) {
                alert("Solo usa los números 1, 2, 3 y 4.");
                return false;
            }

            const unique = new Set(values);
            if (unique.size !== 4) {
                alert("No puedes repetir números. Usa cada número (1,2,3,4) una sola vez.");
                return false;
            }

            appData.answers.disc[idx] = values;
            return true;
        }
    }

    function updateQuestionMap() {
        const type = appData.current.type;
        const key = type.toLowerCase();
        const list = type === 'Valanti' ? appData.questions.valanti : appData.questions.disc;
        const currentIndex = appData.indexes[key];
        const answers = appData.answers[key];
        const mapContainer = document.getElementById('question-map');
        if (!mapContainer) return;
        
        let html = '';
        for (let i = 0; i < list.length; i++) {
            let isAnswered = false;
            const ans = answers[i];
            if (ans && ans[0] !== null && ans[0] !== undefined && !isNaN(ans[0])) {
                isAnswered = true;
            }
            const isActive = i === currentIndex;
            const theme = type === 'Valanti' ? 'teal' : 'red';
            
            let bgCls, borderCls, textCls;
            if (isActive) {
                bgCls = isAnswered ? `bg-${theme}-500` : `bg-${theme}-50`;
                textCls = isAnswered ? 'text-white' : `text-${theme}-700`;
                borderCls = `border-${theme}-500 shadow-md ring-2 ring-${theme}-200`;
            } else {
                bgCls = isAnswered ? `bg-${theme}-500` : 'bg-white';
                textCls = isAnswered ? 'text-white' : 'text-slate-400';
                borderCls = isAnswered ? `border-${theme}-500 opacity-80` : 'border-slate-200';
            }
            
            html += `
                <button onclick="jumpToQuestion(${i})" title="Pregunta ${i + 1}"
                    class="min-w-[36px] max-w-[36px] h-9 rounded-full flex items-center justify-center text-xs font-bold transition-all border-2 flex-shrink-0 hover:scale-110 ${borderCls} ${bgCls} ${textCls}">
                    ${i + 1}
                </button>
            `;
        }
        mapContainer.innerHTML = html;
        
        setTimeout(() => {
            const activeBtn = mapContainer.children[currentIndex];
            if (activeBtn) {
                const mapRect = mapContainer.getBoundingClientRect();
                const btnRect = activeBtn.getBoundingClientRect();
                if (btnRect.left < mapRect.left || btnRect.right > mapRect.right) {
                   activeBtn.scrollIntoView({ inline: 'center', behavior: 'smooth' });
                }
            }
        }, 50);

        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        if (btnPrev) btnPrev.disabled = currentIndex === 0;
        if (btnNext) btnNext.innerHTML = currentIndex === list.length - 1 ? 'Finalizar <i class="fas fa-check ml-2"></i>' : 'Siguiente <i class="fas fa-arrow-right ml-2"></i>';
    }

    function prevQuestion() {
        if (!saveCurrentAnswer()) return;
        const key = appData.current.type.toLowerCase();
        if (appData.indexes[key] > 0) {
            appData.indexes[key]--;
            renderQuestion();
        }
    }

    function jumpToQuestion(targetIndex) {
        if (!saveCurrentAnswer()) return;
        const key = appData.current.type.toLowerCase();
        appData.indexes[key] = targetIndex;
        renderQuestion();
    }

    function nextQuestion() {
        if (!saveCurrentAnswer()) return;
        const type = appData.current.type;
        const key = type.toLowerCase();
        const list = type === 'Valanti' ? appData.questions.valanti : appData.questions.disc;
        const idx = appData.indexes[key];

        if (idx >= list.length - 1) {
            const missing = [];
            for (let i = 0; i < list.length; i++) {
                const ans = appData.answers[key][i];
                if (!ans || ans[0] === null || ans[0] === undefined || isNaN(ans[0])) {
                    missing.push(i + 1);
                }
            }
            if (missing.length > 0) {
                alert(`Debes responder todas las preguntas para finalizar.\nFaltan las preguntas: ${missing.join(', ')}`);
                return;
            }
            finishSubTest(type);
        } else {
            appData.indexes[key]++;
            renderQuestion();
        }
    }

    // 7. FINALIZAR MÓDULO
    function finishSubTest(type) {
        const key = type.toLowerCase();
        appData.status[key] = true;

        const btn = document.getElementById('btn-start-' + key);
        if (btn) {
            btn.onclick = null;
            btn.classList.add('opacity-60', 'grayscale');
        }

        const badge = document.getElementById('status-' + key);
        if (badge) {
            badge.innerText = "COMPLETADO";
            badge.className = "status-badge bg-green-100 text-green-600 inline-block px-2 py-1 rounded mt-4 font-bold";
        }

        const loader = document.getElementById('loading-overlay');
        const loaderText = loader.querySelector('p');
        loaderText.innerText = "Guardando respuestas...";
        loader.classList.remove('hidden');

        // Aplanar respuestas indexadas
        let flatAnswers = [];
        appData.answers[key].forEach(arr => {
            if (arr) flatAnswers.push(...arr);
        });

        google.script.run
            .withSuccessHandler(() => {
                if (loader) loader.classList.add('hidden');
                showView('view-dashboard');
                if (appData.status.valanti && appData.status.disc) {
                    setTimeout(() => showView('view-finish'), 1000);
                }
            })
            .withFailureHandler(err => {
                if (loader) loader.classList.add('hidden');
                alert("Error al guardar: " + err);
            })
            .saveTestResults(type, appData.user, flatAnswers);
    }
    function showInstructionModal(title, contentHtml, theme) {
        const modal = document.getElementById('instruction-modal');
        const modalContent = document.getElementById('modal-content');
        const btn = document.getElementById('btn-modal-action');

        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-body').innerHTML = contentHtml;

        // Dynamic Styling
        // Remove old theme classes (basic approach: remove all potential color classes or just overwrite)
        modalContent.className = `bg-white rounded-xl shadow-2xl max-w-md w-full transform transition-all scale-100 p-6 border-l-8 border-${theme}-500`;

        btn.className = `px-8 py-3 rounded-lg font-bold shadow-md hover:shadow-lg transition transform hover:-translate-y-0.5 text-white bg-${theme}-600 hover:bg-${theme}-700`;

        modal.classList.remove('hidden');
    }

    function closeInstructionModal() {
        document.getElementById('instruction-modal').classList.add('hidden');
    }
</script>
